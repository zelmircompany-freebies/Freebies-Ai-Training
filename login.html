<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — Freebies AI Training</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
<link rel="icon" type="image/x-icon" href="img/favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<div class="login-screen">
  <!-- Декоративный маскот сверху — используем существующий логотип проекта -->
  <div class="login-mascot-top">
    <img src="img/android-chrome-512x512.png" class="login-mascot-img no-download" oncontextmenu="return false" draggable="false" alt="" onerror="this.style.display='none'">
    <div class="login-title">
      <span class="login-title-main">Freebies</span>
      <span class="login-title-sub">Ai Training</span>
    </div>
  </div>
  <p class="login-subtitle">Онлайн-платформа для школьников,<br>их родителей и учителей</p>

  <div class="login-card">
    <h1 class="login-card-title" id="formTitle">Вход</h1>

    <!-- Переключатель ролей -->
    <div class="role-switch">
      <button type="button" class="role-btn active" data-role="student" onclick="selectRole('student')">
        <span class="role-icon">🎓</span>Ученик
      </button>
      <button type="button" class="role-btn" data-role="teacher" onclick="selectRole('teacher')">
        <span class="role-icon">🧑‍🏫</span>Учитель
      </button>
      <button type="button" class="role-btn" data-role="school" onclick="selectRole('school')">
        <span class="role-icon">🏫</span>Школа
      </button>
    </div>

    <!-- Форма: поля немного отличаются между "вход" и "регистрация" -->
    <form id="loginForm" onsubmit="return handleLoginSubmit(event)">
      <div class="login-field-group" id="nameFieldGroup" style="display:none">
        <span class="login-field-icon">🙂</span>
        <input type="text" id="nameField" placeholder="Имя">
      </div>
      <div class="login-field-group">
        <span class="login-field-icon">👤</span>
        <input type="text" id="loginField" placeholder="Логин" required>
      </div>
      <div class="login-field-group">
        <span class="login-field-icon">🔒</span>
        <input type="password" id="passwordField" placeholder="Пароль" required>
      </div>
      <button type="submit" class="login-submit-btn" id="submitBtn">Войти</button>
    </form>

    <div class="login-links">
      <a href="#" onclick="notify('Эта функция пока в разработке'); return false">Забыли пароль?</a>
      <a href="#" id="switchModeLink" onclick="toggleAuthMode(); return false">Создать аккаунт</a>
    </div>
  </div>

  <!-- Декоративный маскот снизу слева -->
  <img src="img/Mood02.png" class="login-mascot-bottom no-download" oncontextmenu="return false" draggable="false" alt="" onerror="this.style.display='none'">
</div>

<div class="toast" id="toast"></div>
<script src="script.js"></script>
<script>
let _authMode='login'; // 'login' | 'register'
let _selectedRole='student';

function selectRole(role){
  if(role==='school'){
    notify('Вход для школ пока недоступен — скоро откроем');
    return;
  }
  _selectedRole=role;
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.toggle('active', b.dataset.role===role));
}

function toggleAuthMode(){
  _authMode = _authMode==='login' ? 'register' : 'login';
  const isRegister = _authMode==='register';
  document.getElementById('formTitle').textContent = isRegister ? 'Регистрация' : 'Вход';
  document.getElementById('submitBtn').textContent = isRegister ? 'Зарегистрироваться' : 'Войти';
  document.getElementById('nameFieldGroup').style.display = isRegister ? 'flex' : 'none';
  document.getElementById('nameField').required = isRegister;
  document.getElementById('switchModeLink').textContent = isRegister ? 'Уже есть аккаунт? Войти' : 'Создать аккаунт';
}

/* Авторизации по-настоящему ещё нет — это заглушка на время разработки.
   Любой введённый логин/пароль считается успешным входом или регистрацией,
   выбранная роль сохраняется в localStorage, чтобы main.html и другие
   страницы знали, под кем сейчас "зашёл" человек. */
function handleLoginSubmit(e){
  e.preventDefault();
  if(_selectedRole==='school'){
    notify('Вход для школ пока недоступен');
    return false;
  }
  localStorage.setItem('fat_user_role', _selectedRole);
  localStorage.setItem('fat_logged_in', '1');
  const nameVal=(document.getElementById('nameField').value||'').trim();
  if(nameVal) localStorage.setItem('fat_user_name', nameVal);
  location.href='main.html';
  return false;
}
</script>
</body>
</html>
