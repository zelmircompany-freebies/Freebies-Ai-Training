<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Урок — Freebies AI Training</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
 <div class="container header-inner">
  <a class="logo" href="index.html"><span class="logo-mark">✦</span><span>Freebies Ai<br><span class="logo-orange">Training</span></span></a>
  <nav class="nav"><a href="index.html">Главная</a><a class="active" href="main.html">Уроки</a><a href="main.html#extras">Функции</a><a href="main.html#about">О нас</a><a href="main.html#faq">FAQ</a></nav>
  <div class="profile">
   <button class="icon-pill theory-btn" onclick="openTheoryPanel()" title="Теория урока"><img src="img/book.png" class="no-download" oncontextmenu="return false" draggable="false" alt="Теория"></button>
   <span class="coin">🪙 743</span><button class="login" onclick="notify('Добро пожаловать!')">Войти</button><button class="menu">☰</button>
  </div>
 </div>
</header>

<main class="lesson-page">
 <div class="container">
  <div class="lesson-head">
   <button class="back-btn" onclick="location.href='main.html'">←</button>
   <div class="lesson-head-text">
    <div class="eyebrow" id="lessonTopic">Загрузка...</div>
    <h1 id="lessonTitle">Загрузка урока...</h1>
   </div>
  </div>

  <!-- Шаги: точки-индикаторы, клик по пройденному шагу возвращает к нему -->
  <div class="step-track" id="stepTrack"></div>
  <div class="step-label" id="stepLabel"></div>

  <!-- Показывается только ТЕКУЩЕЕ задание, справа — робот-помощник (только на широких экранах) -->
  <div class="task-stage">
   <div id="tasksContainer" style="width:100%;max-width:680px"></div>
   <img id="robotBuddy" class="robot-buddy no-download" src="img/Mood01.png" oncontextmenu="return false" draggable="false" alt="Помощник" style="display:none">
  </div>

  <!-- Переход к соседним урокам -->
  <div class="lesson-nav" id="lessonSideNav"></div>
 </div>
</main>

<!-- Полноэкранный робот после завершения всех заданий урока -->
<div id="robotFullscreen" class="robot-fullscreen" style="display:none" onclick="hideFullscreenRobot()">
  <img src="img/Mood00.png" class="no-download" oncontextmenu="return false" draggable="false" alt="Урок пройден">
</div>

<!-- Боковая панель теории -->
<div id="theoryPanel" class="theory-panel">
  <div class="theory-panel-head">
    <span>Теория урока</span>
    <button class="theory-close" onclick="closeTheoryPanel()">✕</button>
  </div>
  <div class="theory-panel-body" id="theoryPanelBody"></div>
</div>
<div id="theoryPanelOverlay" class="theory-panel-overlay" onclick="closeTheoryPanel()"></div>

<div class="toast" id="toast"></div>
<script src="api/client.js"></script>
<script src="script.js"></script>
<script>
  // Номер урока читается из адреса страницы: urok.html?id=1, urok.html?id=2 и т.д.
  // Один файл на все уроки — добавлять новый urokN.html больше не нужно.
  renderLessonPage();
</script>
</body>
</html>
